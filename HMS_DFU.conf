# HMS_DFU Configuration
# Add this file to your application's CONF_FILE when CONFIG_HMS_BLE_DFU=y:
#   set(CONF_FILE "prj.conf;Modules/HMS_BLE/HMS_BLE.conf;Modules/HMS_BLE/HMS_DFU.conf")
#
# Enables the MCUmgr SMP server over BLE (image management + OS reset)
# used by the HMS_DFU feature. Requires the MCUboot bootloader
# (CONFIG_BOOTLOADER_MCUBOOT=y) for image management to work.

# ============================================================================
# MCUmgr core
# ============================================================================
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y

# ============================================================================
# Image management (OTA DFU) — requires MCUboot
# ============================================================================
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_STREAM_FLASH=y

# ============================================================================
# OS management (reset command)
# ============================================================================
CONFIG_MCUMGR_GRP_OS=y

# ============================================================================
# SMP transport over BLE (adds the SMP GATT service)
# ============================================================================
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# ============================================================================
# BLE MTU / buffers — required for practical OTA throughput.
# Without a high ATT MTU the SMP write characteristic negotiates ~23 bytes
# and uploads fragment into tiny packets (very slow / appears to stall).
# ============================================================================
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ============================================================================
# Stack sizes for mcumgr command handlers
# ============================================================================
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2176

# ============================================================================
# Memory knobs for small controllers (nRF54L05 / nRF52832):
#   CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=n   saves the 2475 B reassembly netbuf
#   CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1280  smaller SMP packets
#   CONFIG_BT_MAX_CONN=1
# ============================================================================
