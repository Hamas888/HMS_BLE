# Main project configuration

# ============================================================================
# Note: BLE-specific configurations are managed by HMS_BLE.conf
# C++ standard is enforced at CMakeLists.txt level (more reliable than Kconfig)
# ============================================================================

# Enable C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# ============================================================================
# HMS_BLE control knobs
# ============================================================================
CONFIG_HMS_BLE_DEBUG=y
CONFIG_HMS_BLE_LOG_LEVEL=5

# ============================================================================
# Optional DFU feature (SMP/MCUmgr OTA over BLE)
# ============================================================================
CONFIG_HMS_BLE_DFU=y
CONFIG_HMS_BLE_DFU_AUTO_CONFIRM_DELAY_SEC=5
